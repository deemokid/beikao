<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>错题重做 · 经济基础六卷</title>
<style>
:root{--ink:#1a1a1a;--sub:#6b6b6b;--line:#e2e2e2;--bg:#faf9f7;--ok:#1f7a3d;--bad:#b3261e;--hl:#fff3cd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
 font:16px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
 padding:0 0 90px;max-width:760px;margin:0 auto}
header{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid var(--line);
 padding:10px 14px 8px}
h1{font-size:17px;margin:0 0 6px}
.meta{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--sub);flex-wrap:wrap}
.bar{flex:1;height:6px;background:#eee;border-radius:3px;overflow:hidden;min-width:90px}
.bar>i{display:block;height:100%;background:#3a7d5c;width:0;transition:width .25s}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;
 padding:4px 11px;font-size:13px;color:#444}
.chip.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
main{padding:12px 14px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.tag{font-size:12.5px;color:var(--sub);display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tag b{color:#1a1a1a;font-weight:600}
.imgs img{width:100%;display:block;border-radius:6px;background:#fff;margin:0 0 4px;cursor:zoom-in}
.hint{font-size:13.5px;color:var(--sub);margin:10px 0 6px}
input[type=text]{width:100%;font:inherit;letter-spacing:.18em;text-transform:uppercase;
 padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
input[type=text]:focus{outline:none;border-color:#1a1a1a}
.picks{display:flex;gap:8px;margin:2px 0 0}
.pick{flex:1;font:inherit;font-size:19px;font-weight:600;letter-spacing:0;padding:12px 0;cursor:pointer;
 background:#fff;color:#22262c;border:1px solid var(--line);border-radius:9px;font-family:inherit}
.pick.on{background:#22262c;color:#fff;border-color:#22262c}
.pick.ok{background:#e8f6ed;border-color:#2f9e5c;color:#1c6b3d}
.pick.miss{background:#fff7db;border-color:#d9a900;color:#8a6b00}
.pick.bad{background:#fdecea;border-color:#d9534f;color:#a52a26}
.pick:disabled{cursor:default;opacity:.85}
.row{display:flex;gap:8px;margin-top:10px}
button{font:inherit;border-radius:10px;border:1px solid var(--line);background:#fff;
 padding:11px 14px;cursor:pointer;flex:1}
button.primary{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
button.ghost{flex:0 0 auto;padding:11px 12px;color:var(--sub)}
button:disabled{opacity:.45}
.reveal{border-top:1px dashed var(--line);margin-top:12px;padding-top:10px;display:none}
.reveal.show{display:block}
.verdict{font-size:15px;font-weight:600;margin-bottom:6px}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.ansline{font-size:14px;margin:4px 0}
.ansline code{background:#f2f1ee;padding:1px 6px;border-radius:5px;letter-spacing:.1em}
.exp{font-size:14px;color:#333;background:#faf8f3;border-left:3px solid var(--hl);
 padding:8px 10px;border-radius:0 6px 6px 0;margin:8px 0 0}
.foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
 padding:10px 14px;display:flex;gap:8px;max-width:760px;margin:0 auto}
.foot button{flex:1}
.done-box{text-align:center;padding:30px 10px;color:var(--sub)}
.done-box h2{color:#1a1a1a;font-size:18px;margin:0 0 8px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mini{font-size:12.5px;color:var(--sub);background:#fff;border:1px solid var(--line);
 border-radius:999px;padding:4px 11px;cursor:pointer;font-family:inherit;flex:0 0 auto}


/* ---- 电脑端（≥1000px）：题图在左、作答在右，一屏看完 ---- */
@media (min-width:1000px){
  body{max-width:1120px}
  .card{display:grid;column-gap:20px;
    grid-template-columns:minmax(0,1fr) 380px;
    grid-template-areas:"tag tag" "imgs hint" "imgs input" "reveal reveal";
    align-items:start}
  .tag{grid-area:tag;margin-bottom:6px}
  .imgs{grid-area:imgs;max-height:calc(100vh - 250px);overflow:auto;
    border:1px solid var(--line);border-radius:8px;background:#fff}
  .hint{grid-area:hint;margin:0 0 6px}
  input[type=text],.picks{grid-area:input}
  .reveal{grid-area:reveal}
  .reveal .exp{max-height:26vh;overflow:auto}
  .foot{max-width:1120px}
  main{padding:10px 14px}
}

/* ---- 电脑端 v2：固定栏不遮内容 ---- */
@media (min-width:1000px){
  body{padding-bottom:96px}
  .card{scroll-margin-top:110px}
  header{padding:8px 14px 4px}
  .chips{padding:6px 0 2px}
  .imgs{max-height:calc(100vh - 300px)}
}
</style></head>
<body>

</div>

n":62,"kind":"wrong","mine":"C","right":"A","got":0,"imgs":["q/2_062.jpg"],"exp":"货币制度的构成要素包括货币材料、货币名称、货币单位和价格标准，本位币、辅币及其偿付能力，发行保证制度。"},{"set":"冲刺二","date":"11-05 01:55","n":72,"kind":"less","mine":"CE","right":"ACDE","got":1,"imgs":["q/2_072.jpg"],"exp":"因债的发生原因的不同，债可分为合同之债、侵权之债、不当得利之债和无因管理之债。人情债是道德范畴。"},{"set":"冲刺二","date":"11-05 01:55","n":78,"kind":"zero","mine":"AE","right":"ABCD","got":0,"imgs":["q/2_078.jpg"],"exp":"集中趋势的测度，主要包括位置平均数和数值平均数；位置平均数主要有众数、中位数，数值平均数主要有算术平均数、几何平均数。"},{"set":"冲刺二","date":"11-05 01:55","n":79,"kind":"less","mine":"BD","right":"ABCD","got":1,"imgs":["q/2_079.jpg"],"exp":"影响汇率变动的主要因素有国际收支、相对通货膨胀率、相对利率、总需求与总供给以及市场预期。"},{"set":"冲刺二","date":"11-05 01:55","n":80,"kind":"zero","mine":"ACE","right":"ABC","got":0,"imgs":["q/2_080.jpg"],"exp":"总标题应简明确切地概括出统计表的内容，一般需要标明统计数据的时间(When)、地点(Where)以及何种数据（What），即标题内容应满足“3W”要求。"},{"set":"冲刺二","date":"11-05 01:55","n":81,"kind":"less","mine":"BD","right":"ABCD","got":1,"imgs":["q/2_081.jpg"],"exp":"资产类账户的借方表示增加，贷方表示减少，期初、期末余额一般在借方；权益类账户的贷方表示增加，借方表示减少，期初、期末余额一般在贷方。成本类账户结构、费用类账户结构与资产类账户结构相同，收人类账户结构与权益类账户结构相同。损益类会计账户期末无余额。"},{"set":"冲刺二","date":"11-05 01:55","n":83,"kind":"zero","mine":"AC","right":"AD","got":0,"imgs":["q/2_083.jpg"],"exp":"单位撤销、合并或者改变其隶属关系时，中外合资、国内合资前，企业股份制改造前以及单位主要领导调离工作前等情况下要进行一次全面清查，以明确经济责任。不定期清查是指事先没有安排计划，而是根据需要对财产物资所进行的临时性清查，当单位撤销、合并或改变隶属关系时，应对相关单位的各项财产物资、货币资金、债权、债务进行及时清查，以摸清家底。24"},{"set":"冲刺二","date":"11-05 01:55","n":86,"kind":"less","mine":"ABC","right":"ABCE","got":1.5,"imgs":["q/2_086.jpg"],"exp":"市场并不是万能的，有盲目性、自发性和滞后性的弱点，由此而生的短期行为、盲目生产将导致生产的波动、供需的失衡、资源的破坏与浪费；市场对许多基础设施和公共设施的建设以及公共消费也难以进行有效的调节；市场不能自发地实现收人分配的社会公平和经济总量的平衡。为了有效地发挥市场对资源配置的决定性作用，必须加强和改善国家对经济的宏观调控。"},{"set":"冲刺二","date":"11-05 01:55","n":88,"kind":"less","mine":"CE","right":"ABCE","got":1,"imgs":["q/2_088.jpg"],"exp":"一般来说，财政具有四个基本特征，即弥补市场失效、提供公平服务、非市场营利性和法治性。"},{"set":"冲刺二","date":"11-05 01:55","n":89,"kind":"less","mine":"BCD","right":"BCDE","got":1.5,"imgs":["q/2_089.jpg","q/2_089_b.jpg"],"exp":"财政补贴是指国家为了实现特定的政治、经济 起的行政赔偿诉讼中，证明因受被诉行为侵害而造成损失的事实。，其他应当由原告承担举证责任的事项。"},{"set":"冲刺三","date":"11-06 01:40","n":100,"kind":"zero","mine":"BCD","right":"BC","got":0,"imgs":["q/3_100.jpg"],"exp":"8周岁以上的未成年人是限制民事行为能力人，可以进行与他的年龄、智力相适应的民事活动；其他民事活动由其法定代理人代理，或者征得其法定代理人的同意。不能完全辨认自己行为的精神病人，是限制民事行为能力人，可以进行与其精神健康状况相适应的民事活动；其他民事活动由其法定代理人代理，或者征得其法定代理人的同意。"},{"set":"冲刺三","date":"11-06 01:40","n":101,"kind":"less","mine":"ABE","right":"ABCE","got":1.5,"imgs":["q/3_101.jpg"],"exp":"国有土地使用权出让属于政府性基金预算，选项D错误。"},{"set":"冲刺三","date":"11-06 01:40","n":102,"kind":"less","mine":"CDE","right":"ACDE","got":1.5,"imgs":["q/3_102.jpg"],"exp":"增强财政透明度，提高预算管理信息化水平内容包括改进预决算公开，发挥多种监督方式的协同效应，实现中央和地方财政系统信息贯通，推进部门间预算信息互联共享共四个方面的内容。要增加财政透明度，地方债务应该全面公开化，选项B错误。"},{"set":"冲刺三","date":"11-06 01:40","n":103,"kind":"zero","mine":"ACDE","right":"BCDE","got":0,"imgs":["q/3_103.jpg"],"exp":"选项A属于无效的法律行为。"},{"set":"冲刺三","date":"11-06 01:40","n":104,"kind":"zero","mine":"BCD","right":"CD","got":0,"imgs":["q/3_104.jpg","q/3_104_b.jpg"],"exp":"社会主义公有制经济的主体地位，主要体现在两个方面：一是公有资产在社会总资产中占优势；二是国有经济控制国民经济命脉，对经济发展起主导作用。"},{"set":"冲刺三","date":"11-06 01:40","n":105,"kind":"less","mine":"ACD","right":"ABCD","got":1.5,"imgs":["q/3_105.jpg"],"exp":"提起诉讼或申请仲裁是诉讼时效中断的情形，选项E错误。"}];
const KEY = 'redo_v1';
const norm = s => String(s||'').toUpperCase().replace(/[^A-E]/g,'').split('').sort().join('');
const KIND = {wrong:'单选错', zero:'多选含错项归零', less:'多选少选部分给分', unknown:'记录未导出'};

let done = {};          // key -> 'ok' | 'again'
let picks = {};         // key -> 'AB' 当前勾选的选项
let queue = [];         // 当前要做的
let pos = 0;
let filter = '全部';
let sortMode = 'origin';
const SORTS = [['origin', '按卷顺序'], ['zero', '归零优先'], ['random', '打乱']];
let scopeMode = 'all';
const SCOPES = [['all', '全部'], ['wrong', '只做错的'], ['new', '只做没做的']];
let revealed = false;
const LET = ['A', 'B', 'C', 'D', 'E'];

try {
  const o = JSON.parse(localStorage.getItem(KEY) || '{}');
  done = o.done || o || {};
  picks = o.picks || {};
} catch(e){ done = {}; picks = {}; }
const save = () => localStorage.setItem(KEY, JSON.stringify({ done: done, picks: picks }));
const idOf = it => it.set + '#' + it.n;

const sets = ['全部', ...Array.from(new Set(ITEMS.map(i => i.set)))];
const $ = id => document.getElementById(id);

const RANK = { zero: 0, less: 1, wrong: 2, unknown: 3 };
function shuffled(a){
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}
function buildQueue(reset){
  let src = filter === '全部' ? ITEMS.slice() : ITEMS.filter(i => i.set === filter);
  if (scopeMode === 'wrong') src = src.filter(i => done[idOf(i)] === 'again');
  else if (scopeMode === 'new') src = src.filter(i => !done[idOf(i)]);
  if (sortMode === 'zero') {
    src = src.slice().sort((a, b) =>
      (RANK[a.kind] - RANK[b.kind]) || a.set.localeCompare(b.set) || (a.n - b.n));
  } else if (sortMode === 'random') {
    src = shuffled(src);
  }
  if (reset) {
    queue = src;
    pos = 0;
  }
  return queue;
}

function renderChips(){
  $('chips').innerHTML = '';
  sets.forEach(s => {
    const b = document.createElement('button');
    b.className = 'chip' + (s === filter ? ' on' : '');
    b.textContent = s;
    b.onclick = () => {
      filter = s; pos = 0; buildQueue(true); revealed = false;
      $('scope').textContent = s === '全部' ? '六卷' : s;
      renderChips(); render();
    };
    $('chips').appendChild(b);
  });
}

function renderSorts(){
  $('sorts').innerHTML = '';
  SORTS.forEach(([k, label]) => {
    const b = document.createElement('button');
    b.className = 'chip' + (k === sortMode ? ' on' : '');
    b.textContent = label;
    b.onclick = () => {
      sortMode = k; buildQueue(true); revealed = false; renderSorts(); render();
    };
    $('sorts').appendChild(b);
  });
}

function renderScopes(){
  $('scopes').innerHTML = '';
  SCOPES.forEach(([k, label]) => {
    const b = document.createElement('button');
    b.className = 'chip' + (k === scopeMode ? ' on' : '');
    b.textContent = label;
    b.onclick = () => {
      scopeMode = k; buildQueue(true); pos = 0; revealed = false;
      renderScopes(); render();
    };
    $('scopes').appendChild(b);
  });
}

function progress(){
  const src = filter === '全部' ? ITEMS : ITEMS.filter(i => i.set === filter);
  const ok = src.filter(i => done[idOf(i)] === 'ok').length;
  const again = src.filter(i => done[idOf(i)] === 'again').length;
  const answered = src.filter(i => done[idOf(i)]).length;
  $('cnt').textContent = '已答 ' + answered + ' / ' + src.length + '（对 ' + ok + '）';
  $('prog').style.width = (src.length ? answered / src.length * 100 : 0) + '%';
  let posTxt = again ? ('错 ' + again + ' 道待重做') : '全部做对就收工';
  if (scopeMode !== 'all') posTxt = '当前队列 ' + queue.length + ' 题 · ' + posTxt;
  $('pos').textContent = posTxt;
}

function render(){
  progress();
  const main = $('main');
  main.innerHTML = '';
  if (!queue.length) {
    const tip = scopeMode === 'wrong' ? '这个筛选下没有做错的题了'
              : (scopeMode === 'new' ? '这个筛选下没有没做过的题了' : '这里没有题');
    const box = document.createElement('div');
    box.className = 'done-box';
    box.innerHTML = '<h2>' + tip + '</h2><div>点上面的「全部」换个范围。</div>';
    main.appendChild(box);
    return;
  }
  if (pos >= queue.length) { pos = 0; }
  const it = queue[pos];
  const card = document.createElement('div');
  card.className = 'card';

  const tag = document.createElement('div');
  tag.className = 'tag';
  tag.innerHTML = '<b>' + it.set + '</b><span>' + (it.date||'') + '</span><span>第 ' + it.n +
    ' 题</span><span>' + (KIND[it.kind]||'') + '</span>';
  card.appendChild(tag);

  const imgs = document.createElement('div');
  imgs.className = 'imgs';
  if (it.imgs.length) {
    it.imgs.forEach(p => {
      const a = document.createElement('a');
      a.href = p; a.target = '_blank';
      const img = document.createElement('img');
      img.src = p; img.alt = it.set + ' 第' + it.n + '题'; img.loading = 'lazy';
      a.appendChild(img); imgs.appendChild(a);
    });
  } else {
    imgs.innerHTML = '<div class="hint">（这题没找到题图，按下面的答案回忆考点）</div>';
  }
  card.appendChild(imgs);

  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = '点选你觉得对的字母。多选只点最有把握的 2 个，第 3 个必须有印象才加。';
  card.appendChild(hint);

  const pbox = document.createElement('div');
  pbox.className = 'picks';
  pbox.id = 'picks';
  LET.forEach(c => {
    const b = document.createElement('button');
    b.className = 'pick' + (norm(picks[idOf(it)] || '').indexOf(c) >= 0 ? ' on' : '');
    b.textContent = c;
    b.onclick = () => {
      if (revealed) return;
      let p = norm(picks[idOf(it)] || '');
      p = p.indexOf(c) >= 0 ? p.replace(c, '') : p + c;
      p = norm(p);
      picks[idOf(it)] = p;
      save();
      Array.prototype.forEach.call(pbox.children, x => {
        x.classList.toggle('on', p.indexOf(x.textContent) >= 0);
      });
    };
    pbox.appendChild(b);
  });
  card.appendChild(pbox);

  const rv = document.createElement('div');
  rv.className = 'reveal';
  rv.id = 'reveal';
  card.appendChild(rv);

  main.appendChild(card);
  revealed = false;
  $('btnSubmit').textContent = '提交（Enter）';
  $('btnSubmit').disabled = false;

  $('btnSubmit').onclick = () => {
    if (revealed) { next(); return; }
    const mine = norm(picks[idOf(it)] || '');
    const right = norm(it.right);
    const ok = mine && right && mine === right;
    done[idOf(it)] = ok ? 'ok' : 'again';
    save();
    revealed = true;
    Array.prototype.forEach.call(pbox.children, x => {
      const c = x.textContent;
      const inR = right.indexOf(c) >= 0;
      const inM = mine.indexOf(c) >= 0;
      x.classList.toggle('ok', inR && inM);
      x.classList.toggle('miss', inR && !inM);
      x.classList.toggle('bad', !inR && inM);
      x.classList.remove('on');
      x.disabled = true;
    });
    rv.className = 'reveal show';
    let html = '<div class="verdict ' + (ok ? 'ok' : 'bad') + '">' +
      (ok ? '对了' : (mine ? '不对' : '没选')) + '</div>';
    html += '<div class="ansline">正确答案 <code>' + (it.right || '?') + '</code>';
    if (it.mine) html += '　你那次的答案 <code>' + it.mine + '</code>';
    if (it.got !== undefined && it.kind !== 'wrong' && it.kind !== 'unknown')
      html += '　当时得分 ' + it.got;
    html += '</div>';
    if (it.exp) html += '<div class="exp">' + it.exp.replace(/[<>]/g,'') + '</div>';
    rv.innerHTML = html;
    $('btnSubmit').textContent = '下一题（Enter）';
    progress();
  };

  $('btnSkip').onclick = () => { next(); };
}

function showRoundEnd(){
  const again = queue.filter(i => done[idOf(i)] === 'again');
  if (again.length) {
    $('main').innerHTML = '<div class="done-box"><h2>这一轮做完了</h2>' +
      '<div>做对 ' + (queue.length - again.length) + ' 道，还有 ' + again.length + ' 道没做对。</div>' +
      '<div style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">' +
      '<button class="primary" id="btnOnlyAgain">只做这 ' + again.length + ' 道</button>' +
      '<button class="ghost" id="btnAllAgain">这一套整轮重来</button></div></div>';
    $('btnOnlyAgain').onclick = () => {
      scopeMode = 'wrong'; buildQueue(true); pos = 0; revealed = false;
      renderScopes(); render();
    };
    $('btnAllAgain').onclick = () => {
      queue = filter === '全部' ? ITEMS.slice() : ITEMS.filter(i => i.set === filter);
      pos = 0; revealed = false; render();
    };
    return;
  }
  $('main').innerHTML = '<div class="done-box"><h2>全部做完了</h2>' +
    '<div>这个筛选下没有"还不会"的题了。换一套继续，或者明天再来一遍。</div></div>';
  progress();
}

function firstUnanswered(){
  for (let k = 0; k < queue.length; k++) {
    if (!done[idOf(queue[k])]) return k;
  }
  return -1;
}

function next(){
  pos++;
  if (pos >= queue.length) {
    // 把"还不会"的再放一轮
    const again = queue.filter(i => done[idOf(i)] === 'again');
    if (again.length) {
      queue = again.slice(); pos = 0;
      // 提示
      $('main').innerHTML = '<div class="done-box"><h2>这一轮做完了</h2>' +
        '<div>做对 ' + (queue.length - again.length) + ' 道，还有 ' + again.length + ' 道没做对。</div>' +
        '<div style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">' +
        '<button class="primary" id="btnOnlyAgain">只做这 ' + again.length + ' 道</button>' +
        '<button class="ghost" id="btnAllAgain">这一套整轮重来</button></div></div>';
      $('btnOnlyAgain').onclick = () => {
        scopeMode = 'wrong'; buildQueue(true); pos = 0; revealed = false;
        renderScopes(); render();
      };
      $('btnAllAgain').onclick = () => {
        queue = filter === '全部' ? ITEMS.slice() : ITEMS.filter(i => i.set === filter);
        pos = 0; revealed = false; render();
      };
      return;
    }
    $('main').innerHTML = '<div class="done-box"><h2>全部做完了</h2>' +
      '<div>这个筛选下没有"还不会"的题了。换一套继续，或者明天再来一遍。</div></div>';
    progress();
    return;
  }
  render();
}

$('btnReset').onclick = () => {
  if (!confirm('清空进度，重新开始？')) return;
  done = {}; picks = {}; scopeMode = 'all'; save(); buildQueue(true); pos = 0; renderChips(); renderSorts(); renderScopes(); render();
};

$('btnFull').onclick = () => {
  if (document.fullscreenElement) { document.exitFullscreen(); }
  else { document.documentElement.requestFullscreen().catch(() => {}); }
};

// Enter 提交 / 下一题
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); $('btnSubmit').click(); return; }
  const ch = String(e.key || '').toUpperCase();
  if (LET.indexOf(ch) >= 0 && !revealed) {
    const box = $('picks');
    if (box) {
      const btn = Array.prototype.find.call(box.children, x => x.textContent === ch);
      if (btn) { btn.click(); e.preventDefault(); }
    }
    return;
  }
});

buildQueue(true);
renderChips();
renderSorts();
renderScopes();
if (!queue.length) {
  render();
} else {
  const fu = firstUnanswered();
  if (fu >= 0) { pos = fu; render(); }
  else { pos = 0; showRoundEnd(); }
}
</script>
</body></html>
