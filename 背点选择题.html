<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f5ef">
<title>背点选择题 · 经济基础</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--line:#2a2e38;--fg:#e8eaed;--dim:#9aa0a8;--ok:#3ddc84;--bad:#ff6b6b;--hl:#ffd166;--btn:#2d6cdf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding:0 0 96px}
header{position:sticky;top:0;background:rgba(15,17,21,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px;z-index:9}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.02em}
.stat{font-size:12.5px;color:var(--dim);margin-top:4px}
.bar{height:3px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--btn);transition:width .25s}
main{padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.tag{display:inline-block;font-size:11.5px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-bottom:10px}
.q{font-size:17px;line-height:1.65;font-weight:600;margin:0 0 4px}
.qnote{font-size:12.5px;color:var(--dim);margin:0 0 14px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#20242c;color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:9px 0;font-size:16px;line-height:1.55;cursor:pointer;font-family:inherit}
.opt .k{flex:0 0 22px;height:22px;line-height:22px;text-align:center;border-radius:50%;background:#2c313b;font-size:12.5px;font-weight:700;color:var(--dim);margin-top:1px}
.opt.sel{border-color:var(--btn);background:#1b2740}
.opt.sel .k{background:var(--btn);color:#fff}
.opt.right{border-color:var(--ok);background:#14281d}
.opt.right .k{background:var(--ok);color:#08210f}
.opt.wrong{border-color:var(--bad);background:#2a1618}
.opt.wrong .k{background:var(--bad);color:#2a0b0b}
.opt.miss{border-color:var(--hl);background:#2a2410}
.opt.miss .k{background:var(--hl);color:#322200}
.opt:disabled{cursor:default;opacity:.96}
.verdict{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:14.5px;line-height:1.7;background:#20242c;border:1px solid var(--line);white-space:pre-wrap}
.verdict b{color:var(--hl)}
.verdict.ok{border-color:#2f6b47}
.verdict.bad{border-color:#6b3030}
footer{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(15,17,21,.2),rgba(15,17,21,.98) 40%);display:flex;gap:10px}
button{flex:1;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:600;font-family:inherit;background:var(--btn);color:#fff;cursor:pointer}
button.ghost{background:#20242c;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.45}
.mini{font-size:12px;color:var(--dim);background:none;border:1px solid var(--line);border-radius:999px;padding:5px 10px;cursor:pointer;font-family:inherit}
.summary{font-size:15px;line-height:1.9}
.summary .big{font-size:30px;font-weight:700;color:var(--hl)}
a{color:#7fb0ff}

/* ---- 日间主题（护眼）：覆盖上面的深色配色 ---- */
:root{--bg:#f7f5ef;--card:#ffffff;--line:#e4e0d6;--fg:#22262c;--dim:#6f747c;
 --ok:#1f7a3d;--bad:#b3261e;--hl:#8a6d1f;--btn:#1f5fbf}
body{background:var(--bg);color:var(--fg);font-size:17px;line-height:1.72}
header{background:rgba(247,245,239,.97);border-bottom:1px solid var(--line)}
h1{color:#1b1f24}
.card{background:var(--card)}
.tag{color:var(--dim);border-color:var(--line);background:#fbfaf7}
.q{font-size:18px;line-height:1.7}
.qnote{color:var(--dim)}
.opt{background:#fff;color:var(--fg);border:1px solid var(--line)}
.opt .k{background:#edebe4;color:#5c6169}
.opt.sel{border-color:var(--btn);background:#e9f0fd}
.opt.sel .k{background:var(--btn);color:#fff}
.opt.right{border-color:#2f8f57;background:#e8f6ed}
.opt.right .k{background:#2f8f57;color:#fff}
.opt.wrong{border-color:#c0392b;background:#fdecea}
.opt.wrong .k{background:#c0392b;color:#fff}
.opt.miss{border-color:#c99a00;background:#fff7db}
.opt.miss .k{background:#efc21f;color:#3a2c00}
.verdict{background:#f4f1ea;border-color:var(--line);color:#22262c}
.verdict.ok{border-color:#9ccfae}
.verdict.bad{border-color:#e3b0aa}
button.ghost{background:#fff;color:var(--fg)}
button{background:var(--btn)}
.mini{background:#fff;color:var(--fg);border-color:var(--line)}
.bar{background:#e6e2d8}
.summary .big{color:#8a6d1f}
footer{background:linear-gradient(180deg,rgba(247,245,239,.15),rgba(247,245,239,.99) 40%)}
a{color:#1f5fbf}
.mini{white-space:nowrap;flex:0 0 auto;font-size:13px}
.qnote{white-space:normal;overflow-wrap:anywhere;line-height:1.6}

/* ---- 电脑端（≥900px）：居中、收紧、一屏装下 ---- */
@media (min-width:900px){
  body{max-width:980px;margin:0 auto}
  header{padding:8px 18px 6px}
  .stat{margin-top:2px}
  main{padding:10px 18px}
  .card{padding:14px 18px}
  .q{font-size:19.5px;line-height:1.55;margin:0 0 2px}
  .qnote{margin:0 0 10px}
  .opt{padding:10px 14px;margin:6px 0;font-size:17px}
  .opt .k{margin-top:0}
  .verdict{max-height:34vh;overflow:auto}
  footer{max-width:980px;margin:0 auto;padding:8px 18px}
}

/* ---- 电脑端 v2：紧凑化 + 防止固定栏遮住题干 ---- */
@media (min-width:900px){
  body{padding-bottom:104px}
  header{padding:6px 18px 4px}
  main{padding:8px 18px}
  .card{padding:12px 16px;scroll-margin-top:92px}
  .q{font-size:19px;line-height:1.5;margin:0 0 2px}
  .qnote{margin:0 0 8px;font-size:12.5px}
  .tag{margin-bottom:6px}
  .opt{padding:8px 13px;margin:5px 0;font-size:17px}
  .verdict{margin-top:10px;padding:10px 12px;font-size:14px;line-height:1.6;max-height:30vh;overflow:auto}
  footer{padding:7px 18px}
}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>背点选择题 · 经济基础</h1>
    <div style="display:flex;gap:8px">
      <button class="mini" id="btnWrong">错题目 <span id="wrongN">0</span></button>
      <button class="mini" id="btnFull" title="全屏（F11）">全屏</button>
      <button class="mini" id="btnReset">重来</button>
    </div>
  </div>
  <div class="stat" id="stat">—</div>
  <div class="bar"><i id="bar"></i></div>
</header>
<main><div class="card" id="card"></div></main>
<footer>
  <button class="ghost" id="btnPrev">上一题</button>
  <button id="btnMain">提交</button>
</footer>
<script>
const ITEMS = [{"b":"法律","q":"下列属于特别法人的有","o":["机关法人","社会团体法人","农村集体经济组织法人","城镇农村的合作经济组织法人","基层群众性自治组织法人"],"a":"ACDE","e":"特别法人只有四类：机关法人、农村集体经济组织法人、城镇农村的合作经济组织法人、基层群众性自治组织法人（居委会、村委会）。社会团体法人属于非营利法人（非营利法人＝事业单位法人、社会团体法人、基金会、社会服务机构），不是特别法人。"},{"b":"法律","q":"下列属于行政复议制度（原则）的有","o":["一级复议制度","复议机关可以主动启动复议程序","复议期间具体行政行为不停止执行","被申请人对具体行政行为的合法性负举证责任","复议机关可以作出对申请人更为不利的变更决定"],"a":"ACD","e":"行政复议的制度（原则）六项：①一级复议——对复议决定不服只能向人民法院起诉，不能再次申请复议；②相对人启动——不告不理，只能由相对人申请，复议机关不能主动启动；③复议期间不停止执行（法律规定停止的除外）；④被申请人举证——被申请人对作出的具体行政行为负举证责任；⑤可以调解；⑥禁止不利变更——复议决定不得作出对申请人更为不利的变更。B 项违反相对人启动，E 项违反禁止不利变更。"},{"b":"法律","q":"下列关于仲裁的说法正确的有","o":["以双方当事人自愿达成的仲裁协议为管辖依据","实行一裁终局","原则上不公开进行","当事人对仲裁裁决不服的，可以向人民法院提起上诉","一方不履行仲裁裁决的，另一方可向人民法院申请执行"],"a":"ABCE","e":"仲裁的特点：①自愿性——以双方达成的仲裁协议为管辖依据，达成仲裁协议后不得再向人民法院起诉（或裁或审）；②一裁终局——裁决作出后，当事人就同一纠纷再申请仲裁或向人民法院起诉的，仲裁机构、人民法院不予受理；③保密性——原则上不公开进行（当事人协议公开的可以公开，涉及国家秘密的除外）；④裁决由当事人自觉履行，一方不履行的，另一方可向人民法院申请执行。D 项错在“上诉”：仲裁没有二审，不服裁决只能依法申请撤销或申请不予执行，不能提起上诉。"},{"b":"法律","q":"下列属于担保物权的有","o":["抵押权","质权","留置权","保证","定金"],"a":"ABC","e":"担保物权只有三个类型：抵押权、质权、留置权。保证属于人的担保（以第三人信用担保），定金属于金钱担保，二者是担保方式但不是担保物权；用益物权（土地承包经营权、建设用地使用权、宅基地使用权、居住权、地役权）也不是担保物权。"},{"b":"法律","q":"下列属于债的发生原因的有","o":["合同","侵权行为","不当得利","违约行为","无因管理"],"a":"ABCE","e":"债的发生原因四类：合同、侵权行为、不当得利、无因管理。违约行为不是独立的债的发生原因，它是合同之债不履行的表现，产生的是违约责任，教材把它作为假项排除。"},{"b":"法律","q":"下列属于民法基本原则的有","o":["平等原则","自愿原则","诚信原则","便民原则","绿色原则"],"a":"ABCE","e":"民法基本原则六条：平等原则、自愿原则、公平原则、诚信原则、守法与公序良俗原则、绿色原则。便民原则是行政复议、行政诉讼的原则（复议便民），不是民法原则。"},{"b":"法律","q":"下列情形中，人民法院不予受理的行政诉讼有","o":["行政法规、规章","行政机关对内部工作人员的任免、奖惩决定","法律规定由行政机关最终裁决的具体行政行为","行政机关作出的罚款决定","国防、外交等国家行为"],"a":"ABCE","e":"行政诉讼不予受理的情形：①国防、外交等国家行为；②行政法规、规章或者行政机关制定、发布的具有普遍约束力的决定、命令；③行政机关对行政机关工作人员的任免、奖惩等决定（内部行为）；④法律规定由行政机关最终裁决的具体行政行为。罚款是典型的具体行政行为，属于可诉范围，可以提起行政诉讼。"},{"b":"法律","q":"下列属于自然人的有","o":["本国公民","外国公民","无国籍人","法人","非法人组织"],"a":"ABC","e":"自然人包括本国公民、外国公民和无国籍人三类。法人（营利法人、非营利法人、特别法人）与非法人组织（个人独资企业、合伙企业、不具有法人资格的专业服务机构等）是与自然人并列的民事主体，不是自然人。"},{"b":"法律","q":"下列属于法的实施方式的有","o":["法的遵守","法的执行","法的适用","法的制定","法的汇编"],"a":"ABC","e":"法的实施方式三种：法的遵守（守法）、法的执行（执法）、法的适用（司法）。法的制定（立法）属于法的创制活动，法的汇编属于法的系统化整理，二者都不是法的实施。"},{"b":"法律","q":"法律关系的构成要素包括","o":["法律关系主体","法律事实","法律关系客体","法律关系内容","法律规范"],"a":"ACD","e":"法律关系由三个要素构成：主体（享有权利、承担义务的参加者）、客体（权利和义务所指向的对象：物、行为、智力成果、人身利益）、内容（主体之间的权利和义务）。法律事实是引起法律关系产生、变更、消灭的原因，法律规范是法律关系产生的前提，二者都不是构成要素。"},{"b":"法律","q":"下列属于法人的类型的有","o":["营利法人","非营利法人","特别法人","机关法人","社会团体法人"],"a":"ABC","e":"法人分为营利法人、非营利法人、特别法人三类。营利法人＝有限责任公司、股份有限公司和其他企业法人等；非营利法人＝事业单位法人、社会团体法人、基金会、社会服务机构等；特别法人＝机关法人、农村集体经济组织法人、城镇农村的合作经济组织法人、基层群众性自治组织法人。机关法人、社会团体法人都是子类型，不与三类并列。"},{"b":"法律","q":"下列属于行政处罚种类的有","o":["警告","罚款","责令停产停业","行政拘留","罚金"],"a":"ABCD","e":"行政处罚的种类：警告；罚款；没收违法所得、没收非法财物；责令停产停业；暂扣或者吊销许可证、暂扣或者吊销执照；行政拘留；法律、行政法规规定的其他行政处罚。罚金是刑罚的附加刑，由人民法院判处，不是行政处罚——罚款（行政）与罚金（刑事）是最容易混的一对。"},{"b":"法律","q":"按照规范内容（行为模式）的不同，法律规范可以分为","o":["授权性规范","义务性规范","禁止性规范","任意性规范","准用性规范"],"a":"ABC","e":"按规范内容的不同，法律规范分为三类：授权性规范（可为模式）、义务性规范（应为模式）、禁止性规范（勿为模式）。任意性规范是按强制性程度划分的类别（与强行性规范相对）；准用性规范是按确定性程度划分的类别（与确定性规范、委任性规范相对），都不是按内容划分的类别。"},{"b":"法律","q":"下列属于特殊侵权责任类型的有","o":["产品责任","高度危险作业致害责任","环境污染致害责任","饲养动物致害责任","合同违约致害责任"],"a":"ABCD","e":"特殊侵权责任主要包括：产品责任、高度危险作业致害责任、环境污染致害责任、饲养动物致害责任、无民事行为能力人或限制民事行为能力人致害责任。合同违约产生的是违约责任，属于合同之债，不是侵权责任。"},{"b":"法律","q":"下列属于用益物权的有","o":["土地承包经营权","抵押权","建设用地使用权","宅基地使用权","居住权"],"a":"ACDE","e":"用益物权五类：土地承包经营权、建设用地使用权、宅基地使用权、居住权、地役权。抵押权、质权、留置权是担保物权，不是用益物权。"},{"b":"税收","q":"下列消费品中，属于我国现行消费税税目的有","o":["高档化妆品","饮料","贵重首饰及珠宝玉石","木制一次性筷子","普通护肤护发品"],"a":"ACD","e":"消费税共 15 类税目：烟、酒、高档化妆品、贵重首饰及珠宝玉石、鞭炮焰火、成品油、摩托车、小汽车、高尔夫球及球具、高档手表、游艇、木制一次性筷子、实木地板、电池、涂料。“饮料”不征消费税——酒类税目只含白酒、黄酒、啤酒和其他酒，碳酸饮料、果汁等一般饮料不在其中，这是最常见的错项。普通护肤护发品自 2016 年起也已取消征税，只对高档化妆品征。"},{"b":"税收","q":"个人所得税综合所得适用的超额累进税率包括","o":["15%","20%","25%","30%","50%"],"a":"BCD","e":"综合所得＝工资薪金＋劳务报酬＋稿酬＋特许权使用费，按纳税年度合并计算，适用 3%、10%、20%、25%、30%、35%、45% 七级超额累进税率，最高边际税率 45%，每年减除费用 60000 元（5000 元/月）。选项中 20%、25%、30% 都在七级之内；15% 不是个税税率，而是国家需要重点扶持的高新技术企业减按 15% 征收企业所得税的优惠税率；50% 不存在。"},{"b":"税收","q":"税收的职能包括","o":["财政职能","经济职能","监督职能","资源配置职能","收入分配职能"],"a":"ABC","e":"税收三大职能：① 财政职能——组织财政收入，是税收的基本职能；② 经济职能（调节职能）——通过税收调节资源配置、产业结构、地区分配格局、社会财富分配和居民消费结构；③ 监督职能——通过征收管理反映经济动态、制约督促纳税人。资源配置、收入分配是“财政的职能”（财政三大职能为资源配置、收入分配、经济稳定和发展），不要与税收职能混用。"},{"b":"税收","q":"按照课税对象的不同，我国可将课税对象划分为","o":["商品或劳务的销售额","所得额","关税完税价格","财产额","其他（如产量、数量、特定行为等）"],"a":"ABDE","e":"教材按课税对象把课税对象分为四类：① 商品劳务额，即商品或劳务的销售额；② 所得额，即法人、非法人组织获得的纯利润和个人的收入；③ 财产额，即纳税人占用财产的数量或价值；④ 其他，即以上未包括的课税对象，如产量、数量、特定行为等。关税完税价格是“计税依据”（从价税的计税基础），属于税制要素，不是课税对象的分类。"},{"b":"税收","q":"税收制度（税制）的基本构成要素包括","o":["纳税人","课税对象","税率","纳税担保","税收保全"],"a":"ABC","e":"税制要素共七项：纳税人、课税对象、税率、纳税环节、纳税期限、加成和减免、违章处理。纳税人解决“谁交”，课税对象解决“对什么征”（是区别不同税种的主要标志），税率解决“征多少”，是税收制度的中心环节。纳税担保、税收保全属于税收征管法中的税款征收保障措施，不是税制要素。"},{"b":"税收","q":"我国现行税率的形式包括","o":["比例税率","定额税率","超额累进税率","累退税率","平均税率"],"a":"ABC","e":"税率三种基本形式：比例税率、定额税率、累进税率；累进税率按计算方法分为全额累进、超额累进、超率累进、超倍累进。我国土地增值税实行四级超率累进税率（30%、40%、50%、60%），个人所得税综合所得实行七级超额累进税率，车船税、城镇土地使用税实行定额税率。累退税率不是我国税率形式；平均税率、边际税率是对税率的分析概念（平均税率＝应纳税额÷课税对象数额，边际税率＝最后一个单位税基适用的税率），不是并列的税率形式。"},{"b":"税收","q":"我国增值税的税率包括","o":["13%","9%","3%","6%","20%"],"a":"ABD","e":"增值税税率四档：13%（销售货物、加工修理修配、有形动产租赁、进口货物）、9%（交通运输、邮政、基础电信、建筑、不动产租赁、销售不动产、转让土地使用权以及农产品等货物）、6%（现代服务、生活服务、金融服务、销售无形资产等）、零税率（出口货物和跨境应税行为）。3% 是征收率（简易计税），20% 是个税中利息股息红利、财产租赁、财产转让、偶然所得的比例税率（企业所得税法定税率为 25%），都不是增值税税率。"},{"b":"税收","q":"税收的基本特征包括","o":["强制性","自愿性","无偿性","有偿性","固定性"],"a":"ACE","e":"税收三特征：强制性（国家凭借政治权力依法强制征收）、无偿性（征收后不直接返还、不支付对价）、固定性（课税对象和征收比例由法律事先规定，征收机关和纳税人都不能随意改变）。同时具备这三条的收入形式才是税收；国债有借有还、支付利息，具有自愿性和有偿性，所以国债收入不是税收。"},{"b":"财政","q":"影响财政收入规模的主要因素有","o":["经济发展水平","生产技术水平","生产关系","分配政策","税收征管水平"],"a":"ABD","e":"影响财政收入规模的主要因素有五个：① 经济发展水平（基础性制约，经济越发达，可筹集的财政收入越多）；② 生产技术水平（技术进步提高效益、扩大税基）；③ 经济结构（产业结构、所有制结构、地区结构决定税源分布）；④ 分配制度和分配政策（国家、企业、个人三者分配比例及税负高低）；⑤ 价格（通胀会推高名义财政收入）。“生产关系”不在其中，它属于经济制度范畴，不是财政收入规模的直接影响因素，这是最常见的错项；税收征管水平也不在教材五因素之列。"},{"b":"财政","q":"政府投资性支出的特点有","o":["非营利性","长期性","竞争性","营利性","外部性"],"a":"ABE","e":"政府投资性支出（又称财政投资、公共投资）的三个特点：① 非营利性——不以获取利润为目标，投向社会效益高、民间资本不愿进入的领域；② 长期性——建设周期长、资金回收慢；③ 外部性——基础设施、公用事业的社会效益外溢。竞争性、营利性是民间投资的特征，政府投资一般退出竞争性、营利性领域。"},{"b":"财政","q":"我国财政（公共财政）的基本特征包括","o":["弥补市场失效","提供公平服务","等价交换","非市场营利性","法治性"],"a":"ABDE","e":"财政的四个基本特征：① 弥补市场失效——只干市场干不了、干不好的事；② 提供公平服务——对所有市场主体和社会成员一视同仁；③ 非市场营利性——不以营利为目标、不参与市场竞争；④ 法治性——收支依法进行并接受权力机关审查监督。财政分配是无偿的，不遵循市场等价交换原则，“等价交换”是市场主体的原则，属错项。"},{"b":"财政","q":"财政补贴的构成要素包括","o":["补贴主体","补贴对象","补贴目的","补贴税率","补贴性质"],"a":"ABCE","e":"财政补贴四要素：① 补贴主体——国家；② 补贴对象——企业和居民；③ 补贴目的——贯彻特定政策、满足特定需要、实现特定的政治经济社会目标；④ 补贴性质——通过财政资金无偿补助进行的社会财富再分配。补贴税率是税收要素，不是补贴要素。另外注意：对困难职工的补助属于社会保障支出，不属于财政补贴。"},{"b":"预算","q":"中央一般公共支出预算包括","o":["中央本级支出预算","中央政府性基金预算","中央对地方税收返还和转移支付预算","预备费","地方一般公共预算"],"a":"ACD","e":"中央一般公共支出预算＝中央本级支出预算＋中央对地方税收返还和转移支付预算＋预备费（按中央本级预算支出的 1%—3% 设置）。中央预算共四本账：一般公共预算、政府性基金预算、国有资本经营预算、社会保险基金预算，政府性基金预算是与一般公共预算并列的另一本账，不在一般公共支出预算内；地方一般公共预算属于地方预算。"},{"b":"预算","q":"关于增量预算与零基预算，下列说法正确的有","o":["划分依据是预算编制依据的内容和方法","增量预算以基期收支水平为基础，按本期因素调整","我国各级政府预算已全面实行零基预算","零基预算不考虑基期水平，各项支出从零重新核定","零基预算编制工作量大、周期较长"],"a":"ABDE","e":"政府预算按编制依据的内容和方法分为增量预算和零基预算。增量预算：以基期预算收支为基础，考虑本期增减因素调整后编制，编制简单但容易固化原有支出格局；零基预算：不考虑基期水平，一切从零开始，逐项审议每项支出的必要性和数额，科学但工作量大、周期长。我国近年来推进零基预算改革，但并非各级政府预算已全面实行零基预算。"},{"b":"预算","q":"关于全国人大财经委员会对中央预算草案的初步审查，下列说法正确的有","o":["在全国人民代表大会举行会议前 1 个月进行","由全国人大常委会预算工作委员会单独完成","会同全国人大其他各专门委员会进行","听取财政部、国家税务总局和海关总署的汇报","审查后提出初步审查意见"],"a":"ACDE","e":"《预算法》规定：全国人大财经委员会在全国人民代表大会举行会议前 1 个月，会同全国人大其他各专门委员会，听取财政部、国家税务总局和海关总署关于上年度中央和地方预算执行情况与本年度中央和地方预算草案的汇报，对中央预算草案进行初步审查，提出初步审查意见。初审是人大审查预算的第一道程序，最终由全国人民代表大会审查批准预算，不是由预算工作委员会单独完成。"},{"b":"财政","q":"下列财政支出中，属于购买性支出的有","o":["国防支出","教育支出","社会保障支出","行政管理支出","财政补贴"],"a":"ABD","e":"购买性支出是政府直接购买商品和劳务的支出，包括社会消费性支出（国防、行政管理、教育、科学技术、卫生健康等）和政府投资性支出；它换回了商品和劳务，对交易双方效益约束较强。社会保障支出、财政补贴不换回商品和劳务，属于转移性支出（转移性支出主要由社会保障支出和财政补贴构成）。"},{"b":"货币","q":"我国货币层次划分中，M1 包括","o":["流通中货币","单位活期存款","个人活期存款","非银行支付机构客户备付金","单位定期存款"],"a":"ABCD","e":"M1＝流通中货币＋单位活期存款＋个人活期存款＋非银行支付机构客户备付金。单位定期存款属于 M2（准货币），不是 M1。"},{"b":"货币","q":"关于我国货币供应量层次的表述，正确的有","o":["M0 是流通中货币","准货币包括单位定期存款、个人定期存款等","M2＝M1＋准货币","M1 包括单位定期存款","M0 包括单位活期存款"],"a":"ABC","e":"M0＝流通中货币；M1＝M0＋单位活期存款＋个人活期存款＋非银行支付机构客户备付金；M2＝M1＋准货币，准货币包括单位定期存款、个人定期存款和其他存款。单位定期存款在 M2 而不在 M1（D 错），单位活期存款在 M1 而不在 M0（E 错）。"},{"b":"货币","q":"货币制度的构成要素包括","o":["规定货币材料","规定货币单位","规定主币和辅币","规定货币的法定支付偿还能力","规定中央银行的货币政策目标"],"a":"ABCD","e":"货币制度的基本构成要素有六项：规定货币材料、规定货币单位、规定流通中的货币种类（主币和辅币）、规定货币的法定支付偿还能力（无限法偿与有限法偿）、规定货币铸造发行的流通程序、规定货币发行准备制度。货币政策目标不属于货币制度的构成要素。"},{"b":"货币","q":"关于数字人民币（数字形式的法定货币）性质与运行的说法，正确的有","o":["由中国人民银行发行，是法定货币","与流通中现金等价，定位于 M0","采用双层运营体系，央行不直接对公众开立账户","按活期存款利率计付利息","与比特币等私人数字货币具有相同的法律地位"],"a":"ABC","e":"数字人民币是中国人民银行发行的数字形式法定货币，与纸钞硬币等价，定位于 M0，具有法偿性；采用“中央银行—商业银行（运营机构）”双层运营体系，央行不直接对公众开立账户；不计付利息，实行可控匿名。比特币等私人数字货币不是法定货币，与数字人民币的法律地位不同。"},{"b":"货币","q":"关于汇率标价方法的说法，正确的有","o":["直接标价法以一定单位的外国货币为标准，折算为若干单位的本国货币","间接标价法以一定单位的本国货币为标准，折算为若干单位的外国货币","我国人民币汇率采用直接标价法","直接标价法下，本国货币数额增大表示本币升值","间接标价法下，外国货币数额增大表示本币贬值"],"a":"ABC","e":"直接标价法以一定单位的外国货币为标准折算为若干单位本国货币，汇率上升（本币数额增大）表示本币贬值，D 反了；间接标价法以一定单位的本国货币为标准折算为若干单位外国货币，汇率上升（外币数额增大）表示本币升值，E 反了。我国人民币汇率采用直接标价法。"},{"b":"货币","q":"影响汇率变动的因素有","o":["国际收支","相对通货膨胀率","相对利率","市场预期","商业银行的资本充足率"],"a":"ABCD","e":"影响汇率变动的因素主要包括：国际收支（顺差本币升值、逆差本币贬值）、相对通货膨胀率（本国高于外国则本币贬值）、相对利率（本国利率较高则短期资本流入、本币升值）、总需求与总供给（总需求增长快于总供给，进口增加、本币贬值）、市场预期（预期本币贬值会推动本币进一步贬值）。此外，中央银行对外汇市场的干预也影响汇率。商业银行资本充足率是银行监管指标，不是汇率决定因素。"},{"b":"货币","q":"关于汇率变动方向的判断，正确的有","o":["一国国际收支逆差，本币趋于升值","本国通货膨胀率高于外国，本币趋于贬值","本国利率高于外国，本币趋于贬值","总需求大于总供给，进口增加，本币趋于贬值","市场预期本币贬值，资本外流，推动本币进一步贬值"],"a":"BDE","e":"国际收支逆差→外汇供不应求→本币贬值（A 错）；相对通货膨胀率高于外国→本国商品竞争力下降、出口减少→本币贬值（B 对）；相对利率高于外国→短期资本流入→本币升值（C 错）；总需求大于总供给→进口增加、外汇需求增加→本币贬值（D 对）；市场预期本币贬值→资本外流→本币进一步贬值（E 对）。"},{"b":"货币","q":"关于货币制度演变与信用货币制度的说法，正确的有","o":["16—18 世纪典型的货币制度是金银复本位制","19 世纪典型的货币制度是金本位制","金币本位制具有自由铸造、自由兑换、自由输出入的特点","银本位制是 19 世纪典型的货币制度","信用货币可以自由兑换成黄金"],"a":"ABC","e":"16 世纪以前典型的是银本位制；16—18 世纪金银复本位制成为典型货币制度；19 世纪金本位制取代金银复本位制。金币本位制是典型的金本位制，具有自由铸造、自由兑换、自由输出入三大特点。信用货币制度下货币由国家法律强制流通、主要通过信贷程序发行，不能兑换成黄金。"},{"b":"统计","q":"下列集中趋势测度中，属于位置平均数的有","o":["众数","中位数","算术平均数","几何平均数","标准差"],"a":"AB","e":"集中趋势的测度分为两类：位置平均数，包括众数和中位数；数值平均数，包括算术平均数、几何平均数（以及调和平均数）。标准差属于离散程度测度，不是集中趋势测度。"},{"b":"统计","q":"关于各类平均数的说法，正确的有","o":["算术平均数属于数值平均数，分为简单算术平均数和加权算术平均数","几何平均数主要用于计算平均发展速度","众数是出现次数最多的变量值，不受极端值影响","中位数是位置平均数，受极端值影响较大","几何平均数属于位置平均数"],"a":"ABC","e":"数值平均数包括算术平均数（简单算术平均数、加权算术平均数）、几何平均数（主要用于计算平均发展速度和平均比率）和调和平均数；位置平均数包括众数和中位数。众数是出现次数最多的变量值，中位数是居中位置的变量值，二者都不受极端值影响，D 错；几何平均数是数值平均数，E 错。"},{"b":"统计","q":"关于组距分组中组距和组中值的说法，正确的有","o":["组距＝本组上限－本组下限","组中值＝（本组上限＋本组下限）÷2","缺下限的开口组，组中值＝本组上限－邻组组距÷2","组距＝本组上限＋本组下限","开口组无法计算组中值"],"a":"ABC","e":"组距＝上限－下限；组中值＝（上限＋下限）÷2。开口组的组中值借用邻组组距推算：缺下限的组，组中值＝上限－邻组组距÷2；缺上限的组，组中值＝下限＋邻组组距÷2。"},{"b":"统计","q":"关于四种计量尺度的说法，正确的有","o":["定类尺度只能对事物进行分类，各类之间没有顺序","定序尺度既能分类又能排序，还可以进行加减运算","定距尺度没有绝对零点，可以计算差值","定比尺度具有绝对零点，是最高层次的计量尺度","定距尺度具有绝对零点"],"a":"ACD","e":"四种计量尺度由低到高为定类、定序、定距、定比。定类尺度只能分类，各类之间无顺序、不能比较大小；定序尺度可分类排序，但不能进行加减运算；定距尺度有顺序、可加减，但没有绝对零点（如温度、年份），不能计算比值；定比尺度有绝对零点（如年龄、身高、收入），可加减乘除，是最高层次的计量尺度。"},{"b":"统计","q":"统计表总标题中的“3W”是指","o":["时间（When）","地点（Where）","何种数据（What）","制表人（Who）","计量单位（Which unit）"],"a":"ABC","e":"统计表总标题要概括统计表的全部内容，一般包括时间（When）、地点（Where）、何种数据（What），即“3W”。制表人不是总标题的要素；计量单位属于表头的组成部分（表号、总标题、计量单位），也不是 3W。"},{"b":"统计","q":"统计表一般由下列哪些部分构成","o":["表头","行标题","列标题","数字资料","制表人签名"],"a":"ABCD","e":"统计表一般由表头、行标题、列标题、数字资料和表外附加构成。表头包括表号、总标题和计量单位；表外附加通常放在表的下方，包括资料来源、指标注释和必要的说明。制表人签名不属于统计表的构成要素。"},{"b":"会计","q":"下列情形中，应当对单位的全部财产进行财产全面清查的有","o":["年终决算前","单位撤销、合并或者改变隶属关系前","股份制改造前","单位主要领导调离工作前","每月月末结账前"],"a":"ABCD","e":"全面清查的完整情形清单（六种）：①年终决算前；②单位撤销、合并或者改变隶属关系前；③中外合资、国内合资前；④股份制改造前；⑤开展清产核资、资产评估、资产核实前；⑥单位主要领导调离工作前。这些情形都涉及产权变动或经济责任划断，必须把全部财产物资、货币资金和债权债务一次查清。E 项“每月月末结账前”只是日常的账目核对，属局部清查（库存现金每日由出纳员清点、银行存款每月与银行核对），不是全面清查。"},{"b":"会计","q":"关于账户的基本结构，下列说法正确的有","o":["资产类账户借方登记增加，贷方登记减少","成本类账户的结构与资产类账户相同","收入类账户的结构与资产类账户相同","费用类账户借方登记增加，贷方登记减少","负债类账户借方登记增加，贷方登记减少"],"a":"ABD","e":"账户结构的分组只有两类：借方登记增加、贷方登记减少的是资产类、成本类、费用类账户，期初、期末余额一般在借方；贷方登记增加、借方登记减少的是负债类、所有者权益类、收入类账户，期初、期末余额一般在贷方。所以 A、B、D 正确。C 项把收入类说成与资产类结构相同，实际收入类与负债类、所有者权益类结构相同；E 项把负债类的方向说反了。另记：损益类（收入、费用）账户期末一般无余额。"},{"b":"会计","q":"关于损益类账户及相关账户的期末处理，下列说法正确的有","o":["损益类账户期末一般无余额","收入类账户的结构与所有者权益类账户相同","费用类账户的结构与资产类账户相同","资产类账户的期末余额一般在贷方","成本类账户期末一般无余额"],"a":"ABC","e":"完整规则：①损益类账户（收入类、费用类）期末一般无余额，因为期末要把余额结转出去；②收入类账户贷方登记增加、借方登记减少，结构与所有者权益类账户相同；③费用类账户借方登记增加、贷方登记减少，结构与资产类账户相同；④资产类账户期初、期末余额一般在借方；⑤成本类账户结构与资产类账户相同，期末可以有余额（如在产品成本）。故 D（余额方向说反）、E（成本类期末可以有余额）错误。"},{"b":"会计","q":"下列各项中，属于会计要素计量属性的有","o":["历史成本","重置成本","现值","公允价值","净现值"],"a":"ABCD","e":"会计要素的计量属性共五个：历史成本（又称实际成本、原始成本）、重置成本（又称现行成本）、可变现净值、现值、公允价值。本题五个选项里前四项都在清单内，E 项“净现值”不在清单内——它是投资决策的评价指标，不是会计要素的计量属性，属于把“现值”换了个名字造出来的干扰项。注意别把“净现值”“摊余成本”当成第五个或第六个计量属性。"},{"b":"会计","q":"关于会计要素各计量属性的含义，下列说法正确的有","o":["历史成本是指企业取得各项财产时按照实际支付的成本计量","重置成本又称现行成本，是指按照当前市场条件重新取得同样一项资产所需支付的现金或现金等价物金额","现值是指对未来现金流量以恰当的折现率折现后的价值","历史成本又称现行成本，两者是同一概念的不同叫法","可变现净值是指资产预计从其持续使用和最终处置中所产生的未来净现金流入量的折现金额"],"a":"ABC","e":"五个计量属性的完整定义：①历史成本（实际成本、原始成本）——按取得时的实际支付金额计量；②重置成本（现行成本）——按当前市场条件重新取得同样资产所需支付的现金或现金等价物金额；③可变现净值——在正常生产经营过程中，以预计售价减去进一步加工成本和销售所必需的预计税金、费用后的净值；④现值——对未来现金流量以恰当的折现率折现后的价值；⑤公允价值——市场参与者在计量日发生的有序交易中，出售一项资产所能收到或者转移一项负债所需支付的价格。D 项把历史成本与现行成本混为一谈（现行成本是重置成本的别称）；E 项给的是“现值”的定义，套在了可变现净值上，属典型的定义错位。"},{"b":"会计","q":"下列各项中，属于企业财务报表（财务会计报告中的会计报表）组成部分的有","o":["资产负债表","利润表","现金流量表","所有者权益变动表","成本报表"],"a":"ABCD","e":"财务报表是“四表一注”：资产负债表、利润表、现金流量表、所有者权益变动表，加会计报表附注（年度、半年度财务会计报告还包括财务情况说明书）。四个选项全在清单内。E 项“成本报表”是企业内部管理用的报表，不对外报送，不属于财务报表体系，属于把内部报表混进对外报表的干扰项。"},{"b":"会计","q":"关于会计报表的内容和格式，下列说法正确的有","o":["资产负债表是反映企业某一特定日期财务状况的报表","我国企业的资产负债表采用账户式格式","资产负债表中的资产项目按金额大小顺序排列","所有者权益变动表反映企业年度内股东权益的增减变动情况","利润表是反映企业某一特定日期经营成果的报表"],"a":"ABD","e":"报表口径清单：①资产负债表——反映某一特定日期财务状况，格式有报告式和账户式两种，我国采用账户式；资产按流动性强弱排列（货币资金→存货→固定资产），负债按到期日远近排列（短期借款→长期借款）。②利润表——反映一定会计期间经营成果。③现金流量表——反映一定会计期间现金和现金等价物流入流出，分经营、投资、筹资三类活动。④所有者权益变动表——全面反映企业股东权益在年度内的增减变化，用于判断资本保值增值情况。故 C 错在“按金额大小排列”（应按流动性），E 错在“某一特定日期”（利润表是期间报表）。"},{"b":"经济学基础","q":"下列各项中，属于市场失灵表现的有","o":["自然垄断","信息不充分和信息不对称","外部效应和公共物品","收入分配不公和经济波动","政府对经济干预过多、干预不当"],"a":"ABCD","e":"市场失灵是指市场机制本身固有的缺陷，表现共四项：①自然垄断；②信息不充分和信息不对称；③外部效应和公共物品；④收入分配不公和经济波动。市场有盲目性、自发性和滞后性，对基础设施和公共设施建设、公共消费难以有效调节，也不能自发实现收入分配的社会公平和经济总量平衡，所以必须加强和改善国家对经济的宏观调控。E 项讲的是“政府失灵”，是市场失灵的对称概念，不属于市场失灵的表现。"},{"b":"经济学基础","q":"社会主义宏观经济调控的目标包括","o":["促进经济增长","增加就业","保持利率稳定","稳定物价","实现社会收入分配的绝对平均"],"a":"ABD","e":"宏观调控的四大目标：促进经济增长、增加就业、稳定物价、保持国际收支平衡，财政政策和货币政策都是为这四个目标服务。C 项“保持利率稳定”是货币政策的操作关注点，不是宏观调控的目标（货币政策最终目标四项里也没有“利率稳定”，这是常见错位项）；E 项“绝对平均”本身就是错误导向，宏观调控讲的是收入分配公平，不是平均主义。"},{"b":"经济学基础","q":"社会主义宏观经济调控的手段包括","o":["计划手段","经济手段","法律手段","行政手段","道德手段"],"a":"ABCD","e":"宏观调控手段共四种：计划手段、经济手段、法律手段、行政手段。其中经济手段是主要手段（财政政策、货币政策等），法律手段和行政手段是必要补充。E 项“道德手段”不是宏观调控手段——道德约束、舆论引导属于社会治理和精神文明建设范畴，是多选题里高频的假项（同类的假项还有“文化手段”）。"},{"b":"经济学基础","q":"下列各项中，属于贸易全球化表现的有","o":["国际贸易规模不断扩大，贸易增长速度超过世界生产增长速度","关税和非关税壁垒降低，贸易自由化程度提高","服务贸易和技术贸易在国际贸易中的比重上升","跨国公司在全球范围内配置生产环节、组织国际生产","各国金融市场相互开放，资本跨国流动规模扩大"],"a":"ABC","e":"贸易全球化的表现清单：①国际贸易规模不断扩大，贸易增长快于世界生产的增长；②关税和非关税壁垒不断降低，贸易自由化程度提高（这也使发展中国家进口替代战略所需的保护政策日益受国际规则制约）；③贸易结构变化，服务贸易和技术贸易在国际贸易中的比重上升；④跨国公司在国际贸易中的地位日益重要。D 项是生产全球化的表现（跨国公司全球配置生产环节、组织国际生产），E 项是金融全球化的表现（金融市场相互开放、资本跨国流动扩大）——两者都是经济全球化的真实内容，但不是“贸易全球化”的表现，属于相邻概念错位，这是本科目最爱设的陷阱。"},{"b":"经济学基础","q":"我国对市场管理的主要内容（四个方面）包括","o":["对市场主体的管理","对市场客体的管理","对市场经营活动和竞争方式的管理","对价格的管理","对宏观经济总量的调控"],"a":"ABCD","e":"我国对市场管理的内容主要包括四个方面：①对市场主体的管理（市场主体准入、登记注册）；②对市场客体的管理（进入市场交易的商品和服务的范围与质量标准）；③对市场经营活动和竞争方式的管理（交易中不准缺斤短两、以次充好、降低服务标准，并依法限制不正当竞争）；④对价格的管理。E 项“对宏观经济总量的调控”是宏观调控的职能，不是市场管理的内容，属于把宏观调控混进市场管理的错位项。"},{"b":"货币","q":"下列各项中，属于货币政策操作目标的有","o":["货币供应量","基础货币","存款准备金","政策利率","贷款市场报价利率（LPR）"],"a":"BCD","e":"操作目标是中央银行能够直接控制或影响的短期变量，与政策工具相似度高、可控性最强：①基础货币；②银行体系存款准备金；③政策利率。政策工具的传导链是：政策工具 → 操作目标 → 中介目标 → 最终目标。货币供应量、利率（含 LPR）、汇率属中介目标，是央行不能直接控制、只能间接影响的变量——这是全真四第 10 题的原型。"},{"b":"货币","q":"新巴塞尔资本协议（巴塞尔协议Ⅲ）的三大支柱包括","o":["最低资本要求","监管当局监督检查","市场约束","杠杆率要求","流动性覆盖率要求"],"a":"ABC","e":"三支柱：①最低资本要求（第一支柱）；②监管当局的监督检查（第二支柱）；③市场约束（第三支柱，靠信息披露）。杠杆率、流动性覆盖率（LCR）、净稳定资金比例（NSFR）是第三版新增的量化指标，用来加固第一支柱，不是支柱本身——这是最好出假项的地方。"},{"b":"财政","q":"关于房产税计税依据的说法，正确的有","o":["从价计征以房产余值为计税依据","从租计征以房产租金收入为计税依据","从价计征以房产原值为计税依据","从价计征以房产评估价值为计税依据","房产余值＝房产原值×（1－扣除比例）"],"a":"ABE","e":"房产税两种计税依据：①从价计征——按房产余值，即房产原值一次减除 10%—30% 后的余值（扣除比例由省级政府规定），税率为 1.2%；②从租计征——按租金收入，税率 12%（个人出租住房 4%）。原值、评估价值都不是计税依据：原值要先减除再算余值，评估价值是房产税改革设想中的口径，现行规定里没有。"},{"b":"统计","q":"关于我国工业生产者价格指数（PPI）的说法，正确的有","o":["权数每五年调整一次","权数每年调整一次","反映工业产品出厂价格的变动情况","采用重点调查与典型调查相结合的方法编制","权数十年调整一次"],"a":"ACD","e":"PPI（工业生产者价格指数）反映工业产品出厂价格的变动，编制方法采用重点调查与典型调查相结合，权数每五年调整一次（与 CPI 的权数调整口径容易混，记：PPI 五年一次）。B、E 都错在调整周期——这两个是专门用来试你记没记住「五年」。"},{"b":"法律","q":"关于行政处罚适用的说法，正确的有","o":["不满 14 周岁的未成年人有违法行为的，不予行政处罚","已满 14 周岁不满 18 周岁的未成年人有违法行为的，应当从轻或者减轻行政处罚","行政拘留的期限为 1 日以上 15 日以下","责令停产停业属于能力罚","违法行为在 2 年内未被发现的，一律不再给予行政处罚"],"a":"ABCD","e":"①责任年龄：不满 14 周岁不予处罚（责令监护人管教）；14—18 周岁从轻或减轻。②行政拘留 1—15 日，合并执行不超过 20 日。③责令停产停业剥夺的是从事特定活动的能力，属能力罚（同类的还有暂扣/吊销许可证）。④E 错在「一律」：追责时效一般为 2 年，但涉及公民生命健康安全、金融安全且有危害后果的为 5 年。"},{"b":"货币","q":"关于我国人民币制度的说法，正确的有","o":["人民币制度始建于 1948 年 12 月","人民币是我国的法定货币","我国人民币汇率采用直接标价法","人民币由中国人民银行统一发行","人民币可以自由兑换成黄金"],"a":"ABCD","e":"人民币制度始建于 1948 年 12 月（中国人民银行成立、发行人民币）；人民币是我国法定货币，由中国人民银行统一发行、管理；我国汇率采用直接标价法（以一定单位外币折合本币）。E 错：人民币是信用货币，信用货币制度下货币不能兑换成黄金，靠国家法律强制流通。"},{"b":"货币","q":"关于银行券的说法，正确的有","o":["银行券是代用货币","银行券可以随时兑换成金属货币","银行券由各家商业银行分散发行是其典型特征","现代纸币就是银行券","典型的银行券由中央银行集中发行"],"a":"ABE","e":"银行券＝代用货币，本身价值低于面值，但可随时兑换成金属货币（黄金），所以能代替金属货币流通。早期由商业银行分散发行，不稳定；典型的银行券由中央银行集中发行，以黄金和商业票据作发行准备。C 把早期的临时做法说成典型特征；D 错：现代纸币是信用货币，不能兑换。"},{"b":"货币","q":"中央银行公开市场业务的操作方式包括","o":["回购交易","现券（国债）买卖","发行央行票据","直接向企业发放贷款","调整法定存款准备金率"],"a":"ABC","e":"公开市场业务＝央行在金融市场上与交易对手买卖有价证券、开展回购、发行央行票据等，吞吐基础货币。优点是主动性、灵活性、可逆性强（想放就买、想收就卖，还能反向对冲）。D 错：央行不直接对非金融企业贷款（再贷款对象是金融机构）；E 是存款准备金率工具，属一般性政策工具，不是公开市场业务的方式。"},{"b":"货币","q":"关于我国 2025 年政策利率体系的说法，正确的有","o":["以短期政策利率为核心","通过利率走廊稳定短期利率波动","以贷款市场报价利率（LPR）取代政策利率作为核心","通过定向政策利率精准支持特定领域","取消所有政策利率，完全由市场决定"],"a":"ABD","e":"政策利率体系＝以短期政策利率为核心（央行 7 天期逆回购操作利率为主要政策利率）＋利率走廊稳定短期利率波动＋定向政策利率精准支持特定领域（如支农支小再贷款利率）。C 错：LPR 是报价行报出的贷款市场报价利率，属市场基准利率，由政策利率引导、不是政策利率本身；E 错：改革是理顺传导，不是取消政策利率。"},{"b":"法律","q":"下列情形中，导致委托代理终止的有","o":["代理期限届满或者代理事务完成","被代理人取消委托或者代理人辞去委托","代理人丧失民事行为能力","代理人恢复民事行为能力","作为被代理人或者代理人的法人、非法人组织终止"],"a":"ABCE","e":"委托代理终止：①期限届满或事务完成；②被代理人取消委托、代理人辞去委托；③代理人丧失民事行为能力；④代理人或者被代理人死亡；⑤作为被代理人或代理人的法人、非法人组织终止。D「恢复」是法定代理的终止情形（被代理人取得或恢复民事行为能力），委托代理里没有这一条——一字之差，正是全真四第 83 题的坑。"},{"b":"法律","q":"关于非法人组织的说法，正确的有","o":["个人独资企业、合伙企业是最典型的非法人组织","非法人组织不具有法人资格","非法人组织以自己的财产承担民事责任","非法人组织的财产不足以清偿债务时，出资人或者设立人承担无限责任","非法人组织不能以自己的名义从事民事活动"],"a":"ABCD","e":"非法人组织＝不具有法人资格、但能以自己的名义从事民事活动的组织，包括个人独资企业、合伙企业、不具有法人资格的专业服务机构（如律所、会计师事务所）。财产先由组织自身承担，不足清偿时出资人或设立人承担无限责任。E 说反了——能以自己名义活动正是它区别于「内部机构」的关键（全真四第 68 题考的就是「最典型＝合伙企业」）。"},{"b":"法律","q":"按照对人们行为规定和限定的范围或程度，法律规范可以分为","o":["强行性规范","任意性规范","授权性规范","义务性规范","准用性规范"],"a":"AB","e":"三把尺各管一摊，别混：①按内容（行为模式）分——授权性（可为）、义务性（应为）、禁止性（勿为）；②按强制性程度分——强行性规范、任意性规范（法定范围内允许当事人自行选择、协商）；③按确定性程度分——确定性规范、委任性规范、准用性规范。题目问「范围或程度」，答的是第二把尺。"},{"b":"法律","q":"关于监护的说法，正确的有","o":["未成年人的第一顺序监护人是父母","无民事行为能力或者限制民事行为能力的成年人，第一顺序监护人是配偶","精神病人的第一顺序监护人是父母","父母可以通过遗嘱为子女指定监护人","成年人的监护人只能是近亲属"],"a":"ABD","e":"未成年人：父母是第一顺序监护人（父母死亡或无监护能力才轮到祖父母、外祖父母、兄姐）。无/限制民事行为能力的成年人：顺序为配偶 → 父母、子女 → 其他近亲属 → 其他愿意担任的个人或组织（须经居委会/村委会/民政部门同意）。C 把成年人的第一顺序说成父母，错在跳过了配偶；E 错：还有「其他愿意担任监护人的个人或组织」（意定监护）。"},{"b":"法律","q":"一般侵权责任的构成要件包括","o":["违法行为","损害事实","因果关系","主观过错","违约责任"],"a":"ABCD","e":"一般侵权四要件：①违法行为；②损害事实（无损害无赔偿）；③违法行为与损害之间有因果关系；④行为人主观上有过错（过错责任原则）。特殊侵权才可能在过错之外另设归责原则（如产品责任、高度危险作业）。E 错：违约责任是合同之债不履行的后果，不是侵权要件。"},{"b":"统计","q":"关于抽样调查特点的说法，正确的有","o":["经济性","时效性强","适应面广","准确性高","必须规定统一的标准调查时间"],"a":"ABCD","e":"抽样调查四大特点：经济性（省人省钱）、时效性强（快）、适应面广（能查全面调查查不了的）、准确性高（概率抽样可计算并控制抽样误差）。E 是普查/全面调查的要求——周期性普查要规定统一的标准调查时间，避免重复或遗漏，抽样调查不需要。"},{"b":"会计","q":"关于会计核算基础的表述，正确的有","o":["企业会计确认、计量和报告以权责发生制为基础","权责发生制以款项是否实际收付作为确认标准","行政事业单位财务会计采用权责发生制","收付实现制以款项是否实际收付作为确认标准","行政事业单位预算会计采用权责发生制"],"a":"ACD","e":"权责发生制（应收应付制）——以权利和责任是否发生为标准，凡属本期的收入费用不论款项是否收付都计入本期；收付实现制（现收现付制）——以款项是否实际收付为标准。企业会计、行政事业单位财务会计用权责发生制；行政事业单位预算会计用收付实现制（国务院另有规定除外）。B 把两种基础的定义对调了，E 把预算会计说错。"},{"b":"会计","q":"下列各项中，属于反映企业某一会计期间经营成果的动态会计要素的有","o":["收入","费用","利润","资产","所有者权益"],"a":"ABC","e":"六个会计要素分两组：①静态要素（反映某一特定日期财务状况）——资产、负债、所有者权益，构成资产负债表；②动态要素（反映一定会计期间经营成果）——收入、费用、利润，构成利润表。题目问「期间」和「经营成果」，只答动态的三个。"},{"b":"会计","q":"关于结账程序的表述，正确的有","o":["结账前应将本期发生的经济业务全部登记入账","需要结计本月发生额的账户，应结出本月发生额和余额","年度终了应结出资产、负债和所有者权益类账户的本期发生额和余额并结转下期","结账就是把所有账户的余额结清为零","结账工作可以在对账之前完成"],"a":"ABC","e":"结账顺序：本期业务全部登账 → 对账（账证、账账、账实）→ 结账。结账内容包括：结出本月/本年发生额和余额（月度、年度），年度终了把资产、负债、所有者权益类账户的本期发生额和余额结转下期，损益类账户结平（转入本年利润，期末无余额）。D 错：结账不是清零；E 错：必须先对账后结账。"},{"b":"税收","q":"关于车船税的说法，正确的有","o":["纳税义务发生时间为取得车船所有权或者管理权的当月","车船税按年申报、分月计算、一次性缴纳","购置的新车船，购置当年的应纳税额自纳税义务发生的当月起按月计算","从事机动车交通事故责任强制保险业务的保险机构为扣缴义务人","车船税按月申报缴纳"],"a":"ABCD","e":"车船税：纳税义务发生时间＝取得车船所有权或管理权的当月（不是次月，此处最爱设坑）；按年申报、分月计算、一次性缴纳；新购置车船当年应纳税额自纳税义务发生当月起按月计算；由保险机构在收取交强险保费时代收代缴。E 错：是「按年申报」，不是按月。"},{"b":"会计","q":"关于因素分析法（连环替代法）的说法，正确的有","o":["价格变动影响额＝Σ（报告期价格－基期价格）×报告期销售量","销售量变动影响额＝Σ（报告期销售量－基期销售量）×基期价格","因素替代的顺序是先数量因素、后质量因素","各因素影响额之和应等于分析对象的总差异","因素替代的顺序可以任意颠倒"],"a":"ABCD","e":"连环替代法的两条硬规则：①先替代数量因素、再替代质量因素（先销量后价格），顺序不能颠倒，颠倒后各因素的影响额就变了；②已经替代过的因素用报告期数，尚未替代的用基期数——所以价格影响额乘的是报告期销量，销量影响额乘的是基期价格。各因素影响额之和必须等于总差异，这是检验算没算错的唯一标准。"},{"b":"财政","q":"国际收支平衡表中的局部差额包括","o":["贸易差额","经常差额","综合差额","资本差额","外汇储备差额"],"a":"ABC","e":"局部差额（教材三类）：①贸易差额＝货物出口－进口；②经常差额＝经常账户差额；③综合差额＝经常账户＋资本账户＋非储备金融账户＋净误差与遗漏（衡量国际收支是否平衡的口径）。资本差额、外汇储备差额不是教材的分类——外汇储备是综合差额的对应项（差额由储备变动弥补），不是「局部差额」。"},{"b":"货币","q":"我国《外汇管理条例》所称外汇包括","o":["外币现钞","外币支付凭证或者支付工具","外币有价证券","特别提款权","黄金"],"a":"ABCD","e":"外汇的范围：①外币现钞（纸币、硬币）；②外币支付凭证或支付工具（票据、银行存款凭证、银行卡等）；③外币有价证券（债券、股票等）；④特别提款权（SDR）；⑤其他外币资产。黄金不属于外汇——它是国际储备资产，但不是「外汇」；本国货币、本国有价证券也不是外汇（外汇须「以外币表示」）。"},{"b":"财政","q":"关于复式预算的说法，正确的有","o":["复式预算分为经常预算和资本预算","经常预算以税收为主要收入来源","资本预算以国债为收入来源","资本预算主要用于公共消费性支出","经常预算主要用于投资性支出"],"a":"ABC","e":"复式预算由经常预算（收入主要是税收，支出是公共消费性支出：行政、国防、教育等）和资本预算（收入主要是国债，支出是投资性支出：基础设施、公共工程）组成。D、E 把两个预算的支出方向说反了——这是该考点唯一的出题角度，记住「经常管吃饭、资本管建设」。"},{"b":"财政","q":"中央与地方财政事权和支出责任划分的原则包括","o":["体现基本公共服务受益范围","兼顾政府职能和行政效率","实现权、责、利相统一","激励地方政府主动作为","将支出责任全部上移至中央"],"a":"ABCD","e":"划分原则四条：①体现基本公共服务受益范围（受益范围覆盖全国的归中央，地方性的归地方）；②兼顾政府职能和行政效率；③实现权、责、利相统一；④激励地方政府主动作为。另有一条「支出责任与事权相适应」。E 与改革方向相反——改革是适度加强中央事权、同时把适合地方的放给地方，不是全上移。"},{"b":"法律","q":"关于民事责任的说法，正确的有","o":["民事责任的功能主要在于弥补损害，而不是惩罚","民事责任可以由当事人协商确定","民事责任以财产责任为主","民事责任的承担方式包括停止侵害、排除妨碍、赔偿损失等","民事责任只能由人民法院判决确定"],"a":"ABCD","e":"民事责任的特征：①功能是弥补损害、恢复原状（惩罚是刑事责任的、处罚是行政责任的——全真三第 69 题就考这句）；②允许当事人协商（可以约定违约金、可以和解），这是它区别于行政/刑事责任的关键；③以财产责任为主；④承担方式十种：停止侵害、排除妨碍、消除危险、返还财产、恢复原状、修理重作更换、继续履行、赔偿损失、支付违约金、消除影响恢复名誉、赔礼道歉。E 错：还可以协商、调解、仲裁。"},{"b":"货币","q":"货币的职能中，属于基本职能的有（　）。","o":["价值尺度","流通手段","贮藏手段","支付手段","世界货币"],"a":"AB","e":"判别：五种职能里只有价值尺度（标价）和流通手段（一手交钱一手交货）是基本职能，其余三种是派生。"},{"b":"货币","q":"衍生金融工具主要包括（　）。","o":["期货","期权","互换","股票","债券"],"a":"ABC","e":"判别：衍生＝价值依附在别的标的物上，只有期货、期权、互换三类；股票、债券是基础（原生）工具。"},{"b":"会计","q":"《企业会计准则》对会计信息质量的要求包括（　）。","o":["可靠性","相关性","实质重于形式","谨慎性","收付实现制"],"a":"ABCD","e":"判别：八项质量要求＝可靠、相关、清晰、可比、实质重于形式、重要、谨慎、及时；收付实现制是确认基础，不是质量要求。"},{"b":"财政","q":"财政支出按经济性质分类，可分为（　）。","o":["购买性支出","转移性支出","教育支出","国防支出","社会保障和就业支出"],"a":"AB","e":"判别：按经济性质只有两类——购买性（政府买东西，有对价）和转移性（白给，无对价）；教育、国防、社保是「功能分类」科目。这一条考了三次。"},{"b":"法律","q":"行政强制执行的方式包括（　）。","o":["加处罚款或者滞纳金","划拨存款、汇款","拍卖查封扣押的财物","代履行","罚款"],"a":"ABCD","e":"判别：罚款是行政处罚（罚你），加处罚款才是执行（逼你交）；执行方式＝加处、划拨、拍卖、排除妨碍恢复原状、代履行。"},{"b":"财政","q":"关于增值税，说法正确的有（　）。","o":["属于中央与地方共享税","属于商品劳务税","属于从价税","属于从量税","属于所得税"],"a":"ABC","e":"判别：增值税＝共享税＋商品劳务税＋从价税（按价格的百分比）。从量＝按数量定额，跟价格无关。"},{"b":"法律","q":"关于限制民事行为能力人，说法正确的有（　）。","o":["8 周岁以上的未成年人是限制民事行为能力人","12 周岁以上才是限制民事行为能力人","可以独立实施纯获利益的民事法律行为","不能完全辨认自己行为的精神病人是限制民事行为能力人","其实施的所有行为都无效"],"a":"ACD","e":"判别：门槛是 8 周岁，不是 12；纯获利益、与年龄智力相适应的行为有效；精神病人按辨认能力分限制与无。"},{"b":"法律","q":"下列属于无效民事法律行为的有（　）。","o":["无民事行为能力人实施的","行为人与相对人以虚假意思表示实施的","违反法律强制性规定","违背公序良俗","显失公平"],"a":"ABCD","e":"判别：显失公平是「可撤销」，不是无效；无效四类＝无行为能力、虚假表示、违法强制规定、违背公序良俗。"},{"b":"经济基础","q":"社会主义公有制经济的主体地位主要体现在（　）。","o":["公有资产在社会总资产中占优势","国有经济控制国民经济命脉","公有制企业数量占多数","国有经济对经济发展起主导作用","非公有制经济不再保留"],"a":"ABD","e":"判别：两个体现＝公有资产占优势＋国有经济控制命脉、起主导；从来不是「企业数量占多数」。"}];
const KEY = 'bkd_choice_v1';
const LET = ['A','B','C','D','E'];
document.addEventListener('DOMContentLoaded', () => {
  const b = document.getElementById('btnFull');
  if (b) b.onclick = () => {
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else { document.documentElement.requestFullscreen().catch(() => {}); }
  };
});

let st = { i: 0, picks: {}, done: {}, wrongOnly: false, order: null };

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const o = JSON.parse(raw); if(o && o.done){ st.done = o.done || {}; } }
  }catch(e){}
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({done: st.done})); }catch(e){} }

let queue = [];
function rebuild(){
  queue = ITEMS.map((it, i) => i);
  if(st.wrongOnly){
    queue = queue.filter(i => (st.done[i] || {}).score === 'x');
    if(!queue.length){ st.wrongOnly = false; queue = ITEMS.map((it,i)=>i); }
  }
  st.i = 0;
}

function scoreOf(pick, ans){
  const p = pick.split('').sort().join('');
  const a = ans.split('').sort().join('');
  if(p === a) return 2;
  for(const c of p){ if(a.indexOf(c) < 0) return 0; }
  return Math.round(p.length * 10) / 20;   // 少选：每个 0.5
}

function render(){
  const idx = queue[st.i];
  const it = ITEMS[idx];
  const rec = st.done[idx];
  const answered = !!rec;
  const pick = (st.picks[idx] || (rec ? rec.pick : '')) || '';
  const card = document.getElementById('card');
  let h = '';
  h += '<span class="tag">' + it.b + '</span>';
  h += '<p class="q">' + it.q + '</p>';
  h += '<p class="qnote">多选 · 选全对得 2 分，少选按项给分，含错项 0 分</p>';
  for(let j = 0; j < 5; j++){
    const c = LET[j];
    let cls = 'opt';
    if(answered){
      const inAns = it.a.indexOf(c) >= 0;
      const inPick = pick.indexOf(c) >= 0;
      if(inAns && inPick) cls += ' right';
      else if(inAns && !inPick) cls += ' miss';
      else if(!inAns && inPick) cls += ' wrong';
    } else if(pick.indexOf(c) >= 0) cls += ' sel';
    h += '<button class="' + cls + '" data-c="' + c + '"' + (answered ? ' disabled' : '') + '>'
       + '<span class="k">' + c + '</span><span>' + it.o[j] + '</span></button>';
  }
  if(answered){
    const good = rec.score === 2;
    h += '<div class="verdict ' + (good ? 'ok' : 'bad') + '">';
    h += '你的选择：' + (pick || '（空）') + '　正确答案：<b>' + it.a + '</b>\n';
    h += '得分：' + (rec.score === 'x' ? '0' : rec.score) + ' / 2　';
    h += (rec.score === 2 ? '✅ 全对' : (rec.score === 0 || rec.score === 'x' ? '❌ 归零' : '△ 少选'));
    h += '\n' + it.e;
    h += '</div>';
  }
  card.innerHTML = h;

  card.querySelectorAll('.opt').forEach(b => {
    b.addEventListener('click', () => {
      if(st.done[idx]) return;
      const c = b.dataset.c;
      let p = st.picks[idx] || '';
      p = p.indexOf(c) >= 0 ? p.replace(c, '') : (p + c).split('').sort().join('');
      st.picks[idx] = p;
      render();
    });
  });

  const total = ITEMS.length;
  const answeredN = Object.keys(st.done).length;
  const fulls = Object.values(st.done).filter(r => r.score === 2).length;
  const zeros = Object.values(st.done).filter(r => r.score === 'x').length;
  const lost = Object.values(st.done).reduce((s, r) => s + (r.score === 'x' ? 2 : 2 - r.score), 0);
  document.getElementById('stat').textContent =
    '已答 ' + answeredN + ' / ' + total +
    '　全对 ' + fulls + '　归零 ' + zeros +
    '　累计失分 ' + (Math.round(lost * 10) / 10);
  document.getElementById('bar').style.width = (100 * answeredN / total).toFixed(1) + '%';
  document.getElementById('wrongN').textContent = zeros;

  const main = document.getElementById('btnMain');
  if(answered) main.textContent = (st.i + 1 < queue.length) ? '下一题' : '看结果';
  else main.textContent = '提交';

  const prev = document.getElementById('btnPrev');
  prev.disabled = st.i === 0;
  st.summary = false;
  document.getElementById('card').scrollIntoView({block:'start', behavior:'auto'});
}

document.getElementById('btnMain').addEventListener('click', () => {
  const idx = queue[st.i];
  const it = ITEMS[idx];
  if(!st.done[idx]){
    const pick = st.picks[idx] || '';
    if(!pick) return;
    const sc = scoreOf(pick, it.a);
    st.done[idx] = { pick: pick, score: sc === 0 ? 'x' : sc };
    save();
    render();
    return;
  }
  if(st.summary){ restart(); return; }
  if(st.i + 1 < queue.length){ st.i++; render(); return; }
  showSummary();
});

document.getElementById('btnPrev').addEventListener('click', () => { if(st.i > 0){ st.i--; render(); } });

document.getElementById('btnWrong').addEventListener('click', () => {
  st.wrongOnly = !st.wrongOnly;
  rebuild();
  if(!queue.length) return;
  render();
});

document.getElementById('btnReset').addEventListener('click', () => {
  if(!confirm('清空所有答题记录？')) return;
  st.done = {}; st.picks = {}; st.wrongOnly = false;
  save(); rebuild(); render();
});

function restart(){
  st.done = {}; st.picks = {}; st.wrongOnly = false; st.summary = false;
  save(); rebuild(); render();
}

function showSummary(){
  st.summary = true;
  const total = ITEMS.length;
  const answeredN = Object.keys(st.done).length;
  const got = Object.values(st.done).reduce((s, r) => s + (r.score === 'x' ? 0 : r.score), 0);
  const fulls = Object.values(st.done).filter(r => r.score === 2).length;
  const zeros = Object.values(st.done).filter(r => r.score === 'x').length;
  const half = answeredN - fulls - zeros;
  const pct = answeredN ? Math.round(100 * got / (answeredN * 2)) : 0;
  document.getElementById('card').innerHTML =
    '<div class="summary">' +
    '<div class="big">' + (Math.round(got * 10) / 10) + ' / ' + (answeredN * 2) + ' 分</div>' +
    '正确率 ' + pct + '%（按满分折算）<br><br>' +
    '全对 ' + fulls + ' 题　少选 ' + half + ' 题　归零 ' + zeros + ' 题<br><br>' +
    '归零题＝多选了不能确定的项。回到「错题目」重做一遍，<b>只选你能说出理由的</b>。<br><br>' +
    '<button class="mini" id="btnRestart">重新开始（清空这轮记录）</button>' +
    '</div>';
  const rb = document.getElementById('btnRestart');
  if(rb) rb.addEventListener('click', restart);
  document.getElementById('btnMain').textContent = '再刷一遍';
}

load();
rebuild();
render();
</script>
